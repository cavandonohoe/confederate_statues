name: Refresh dataset

on:
  schedule:
    - cron: "0 13 1 * *"  # 1st of each month at 13:00 UTC (~6am Pacific)
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: >-
          Override the shrink guard (only when a large upstream removal is
          expected and has been checked by hand).
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The refresh is pushed with GITHUB_TOKEN, which does not trigger
    # other workflows, so the service ingest is smoke-tested here against
    # the same Postgres version service-ci uses.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statues_refresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      STATUE_API_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/statues_refresh
      STATUE_API_LOG_JSON: "false"
      # Shrink-guard override for both the R validator and the service ingest.
      STATUE_ALLOW_SHRINK: ${{ inputs.allow_shrink && 'true' || 'false' }}
      STATUE_API_ALLOW_SHRINK: ${{ inputs.allow_shrink && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::dplyr
            any::stringr
            any::tidyr
            any::tibble
            any::here
            any::rlang
            any::testthat
            any::tidyverse
            any::rmarkdown

      - name: Re-download raw HTML from Wikipedia
        run: Rscript scripts/refetch_raw.R

      - name: Regenerate dataset from raw HTML
        run: Rscript scripts/refresh_data.R

      # Validate the freshly regenerated dataset before committing it.
      # A push made with GITHUB_TOKEN does not trigger the R tests
      # workflow, so run the same checks here; a broken Wikipedia parse
      # must fail the job rather than land on main.
      - name: Run testthat suite
        run: |
          Rscript -e '
            results <- testthat::test_dir("tests/testthat", reporter = "summary")
            df <- as.data.frame(results)
            if (any(df$failed > 0) || any(df$error)) {
              quit(status = 1)
            }
          '

      - name: Validate regenerated dataset
        run: Rscript scripts/validate_data.R

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml

      - name: Install service
        working-directory: service
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run service tests against regenerated dataset
        working-directory: service
        env:
          STATUE_API_DATABASE_URL: "sqlite:///:memory:"
        run: pytest

      # Load the currently committed dataset, then ingest the regenerated
      # snapshot on top of it. This exercises the same upsert/delete path
      # production uses, including the service-side shrink guard.
      - name: Smoke ingest (committed -> regenerated) against Postgres
        working-directory: service
        run: |
          alembic upgrade head
          git show HEAD:data/confederate_statue_dates.csv > "$RUNNER_TEMP/committed.csv"
          statue-api ingest --csv "$RUNNER_TEMP/committed.csv"
          statue-api ingest --csv ../data/confederate_statue_dates.csv

      - name: Rebuild README and HTML charts from validated data
        run: |
          Rscript -e 'rmarkdown::render("README.Rmd"); rmarkdown::render("plots.Rmd")'

      # Everything above is the gate: a failed test, validation, shrink
      # guard or smoke ingest fails the job before anything is committed,
      # and the scheduled-failure-alert workflow opens an issue. A green run
      # commits straight to main.
      - name: Commit and push if changed
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data-raw/*.html data/confederate_statue_dates.csv README.md README_files

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          unexpected="$(git diff --cached --name-only \
            | grep -Ev '^(data-raw/[a-z_]+\.html|data/confederate_statue_dates\.csv|README\.md|README_files/.*)$' \
            || true)"
          if [ -n "$unexpected" ]; then
            echo "ERROR: refusing to commit unexpected files:"
            echo "$unexpected"
            exit 1
          fi

          added="$(git diff --cached --numstat -- data/confederate_statue_dates.csv | cut -f1)"
          removed="$(git diff --cached --numstat -- data/confederate_statue_dates.csv | cut -f2)"
          git commit -m "Refresh confederate_statue_dates.csv (+${added:-0} / -${removed:-0} rows)"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed; rebasing on remote and retrying ($i/3)..."
            git pull --rebase origin main
          done
          echo "ERROR: failed to push the refresh after 3 attempts."
          exit 1

      - name: Upload standalone HTML report
        uses: actions/upload-artifact@v7
        with:
          name: statues-report
          path: plots.html
          if-no-files-found: error
