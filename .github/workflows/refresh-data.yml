name: Refresh dataset

on:
  schedule:
    - cron: "0 13 1 * *"  # 1st of each month at 13:00 UTC (~6am Pacific)
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: >-
          Override the shrink guard (only when a large upstream removal is
          expected and has been checked by hand).
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The refresh PR is opened with GITHUB_TOKEN, which does not trigger
    # other workflows, so the service ingest is smoke-tested here against
    # the same Postgres version service-ci uses.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statues_refresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      STATUE_API_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/statues_refresh
      STATUE_API_LOG_JSON: "false"
      # Shrink-guard override for both the R validator and the service ingest.
      STATUE_ALLOW_SHRINK: ${{ inputs.allow_shrink && 'true' || 'false' }}
      STATUE_API_ALLOW_SHRINK: ${{ inputs.allow_shrink && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::dplyr
            any::stringr
            any::tidyr
            any::tibble
            any::here
            any::rlang
            any::testthat
            any::tidyverse
            any::rmarkdown

      - name: Re-download raw HTML from Wikipedia
        run: Rscript scripts/refetch_raw.R

      - name: Regenerate dataset from raw HTML
        run: Rscript scripts/refresh_data.R

      # Validate the freshly regenerated dataset before opening a PR.
      # The refresh PR is authored by the GITHUB_TOKEN bot, so it does
      # not trigger the R tests workflow; run the same checks here so a
      # broken Wikipedia parse can't land as a green "no checks" PR.
      - name: Run testthat suite
        run: |
          Rscript -e '
            results <- testthat::test_dir("tests/testthat", reporter = "summary")
            df <- as.data.frame(results)
            if (any(df$failed > 0) || any(df$error)) {
              quit(status = 1)
            }
          '

      - name: Validate regenerated dataset
        run: Rscript scripts/validate_data.R

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml

      - name: Install service
        working-directory: service
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run service tests against regenerated dataset
        working-directory: service
        env:
          STATUE_API_DATABASE_URL: "sqlite:///:memory:"
        run: pytest

      # Load the currently committed dataset, then ingest the regenerated
      # snapshot on top of it. This exercises the same upsert/delete path
      # production uses, including the service-side shrink guard.
      - name: Smoke ingest (committed -> regenerated) against Postgres
        working-directory: service
        run: |
          alembic upgrade head
          git show HEAD:data/confederate_statue_dates.csv > "$RUNNER_TEMP/committed.csv"
          statue-api ingest --csv "$RUNNER_TEMP/committed.csv"
          statue-api ingest --csv ../data/confederate_statue_dates.csv

      - name: Rebuild README and HTML charts from validated data
        run: |
          Rscript -e 'rmarkdown::render("README.Rmd"); rmarkdown::render("plots.Rmd")'

      - name: Open PR if data changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh confederate_statue_dates.csv"
          title: "Refresh monthly dataset"
          body: |
            Automated monthly refresh of the dataset.

            1. `scripts/refetch_raw.R` re-downloaded the Wikipedia
               source pages to `data-raw/`.
            2. `scripts/refresh_data.R` re-ran the scrape -> clean
               pipeline against `data-raw/` and rewrote
               `data/confederate_statue_dates.csv`.

            Tests, dataset validation (including the shrink guard against
            the committed dataset), the service test suite, and a Postgres
            smoke ingest of committed -> regenerated data all passed before
            both charts were rebuilt.

            If the diff looks unexpected, check whether any source
            page changed its structure (the parser keys off `(YYYY)`
            tokens in the page text).
          branch: bot/refresh-data
          delete-branch: true
          add-paths: |
            data-raw/*.html
            data/confederate_statue_dates.csv
            README.md
            README_files/**

      - name: Upload standalone HTML report
        uses: actions/upload-artifact@v4
        with:
          name: statues-report
          path: plots.html
          if-no-files-found: error
