name: Refresh dataset

on:
  schedule:
    - cron: "0 13 1 * *"  # 1st of each month at 13:00 UTC (~6am Pacific)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::dplyr
            any::stringr
            any::tidyr
            any::tibble
            any::here
            any::rlang

      - name: Run refresh script
        run: Rscript scripts/refresh_data.R

      - name: Open PR if data changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh confederate_statue_dates.csv"
          title: "Refresh monthly dataset"
          body: |
            Automated monthly refresh of `data/confederate_statue_dates.csv`
            by re-running `scripts/refresh_data.R` against the Wikipedia
            source pages.

            If the diff looks unexpected, check whether any of the source
            pages changed their structure.
          branch: bot/refresh-data
          delete-branch: true
          add-paths: |
            data/confederate_statue_dates.csv
