name: service-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "service/**"
      - ".github/workflows/service-ci.yml"
  push:
    branches: [main]
    paths:
      - "service/**"
      - ".github/workflows/service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy src

  test:
    name: pytest (sqlite + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statues_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      STATUE_API_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/statues_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (SQLite in-memory)
        env:
          STATUE_API_DATABASE_URL: "sqlite:///:memory:"
        run: pytest --cov-fail-under=70

      - name: Apply migrations against Postgres
        run: alembic upgrade head

      - name: Smoke ingest against Postgres
        run: statue-api ingest --csv ../data/confederate_statue_dates.csv

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: service/coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: docker build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-type, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: service
          push: false
          tags: statue-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
