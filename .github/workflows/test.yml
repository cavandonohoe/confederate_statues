name: R tests

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "data-raw/**"
      - "R/**"
      - "scripts/**"
      - "tests/**"
      - "README.Rmd"
      - "plots.Rmd"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "data-raw/**"
      - "R/**"
      - "scripts/**"
      - "tests/**"
      - "README.Rmd"
      - "plots.Rmd"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testthat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::rvest
            any::dplyr
            any::stringr
            any::tidyr
            any::tibble
            any::tidyverse
            any::rmarkdown

      - name: Run testthat
        run: |
          Rscript -e '
            results <- testthat::test_dir("tests/testthat", reporter = "summary")
            df <- as.data.frame(results)
            if (any(df$failed > 0) || any(df$error)) {
              quit(status = 1)
            }
          '

      - name: Validate checked-in dataset
        run: Rscript scripts/validate_data.R

      - name: Regenerate dataset and verify charts render
        run: |
          Rscript scripts/refresh_data.R
          Rscript scripts/validate_data.R
          Rscript -e 'rmarkdown::render("README.Rmd"); rmarkdown::render("plots.Rmd")'

      - name: Upload regenerated data and charts
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-statues
          path: |
            data/confederate_statue_dates.csv
            README.md
            README_files/
            plots.html
