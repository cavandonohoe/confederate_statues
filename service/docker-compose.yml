services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: statues
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STATUE_API_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/statues
      STATUE_API_LOG_JSON: "false"
    ports:
      - "8000:8000"
    volumes:
      - ../data:/data:ro

volumes:
  pgdata: {}
